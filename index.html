<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1310" media="(prefers-color-scheme: dark)">
<meta name="description" content="El juego de bolsillo para competir con tus amigos por la corona del baño.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trono">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="El Trono">
<meta name="format-detection" content="telephone=no">
<title>El Trono</title>
<script>try{var t=localStorage.getItem('trono.theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){if(m.media)m.dataset.media=m.media;m.removeAttribute('media');m.setAttribute('content',t==='dark'?'#1a1310':'#fff7ec')})}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: juguetón y absurdo, pero prolijo: un juego de bolsillo, nunca una app de salud
   IDEA: un tamagotchi de baño con tienda, podio, misiones, chat y temporadas entre amigos
   PICTURE: tu personaje viviendo en su ambiente, grande, arriba de todo
   COLOUR and TYPE: crema y chocolate, con amarillo, menta y lavanda; Fredoka + Nunito, escala 12/14/15/18/24
   LAYOUT: columna de teléfono con márgenes de 16, ritmo de 12, barra de monedas arriba y navegación de cinco abajo */
:root{color-scheme:light dark;
--bg:light-dark(#fff7ec,#1a1310);--bg2:light-dark(#fbecd8,#2a1f19);--card:light-dark(#fff,#241a15);--ink:light-dark(#3a2316,#f6ebe0);
--mute:light-dark(#937864,#b39a86);--line:light-dark(#f0e0cb,#3a2c25);--choc:light-dark(#6b3f25,#f5c98a);
--yel:#ffd257;--yel2:#e9a90f;--mint:#8fe0c2;--mint2:light-dark(#e3f8ef,#1c302a);--lav:#c3aefc;--lav2:light-dark(#f1ecff,#272240);--pink:#ff9fb1;
--sh:0 1px 2px light-dark(rgb(90 50 20/.06),rgb(0 0 0/.3)),0 10px 24px -14px light-dark(rgb(90 50 20/.28),rgb(0 0 0/.6));
--r:20px;--g:12px;--px:20px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
html{scrollbar-width:none}::-webkit-scrollbar{display:none;width:0;height:0}
#screen{height:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain}
#phone{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;text-align:center;vertical-align:middle;margin:0}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
[hidden]{display:none!important}
.mute{color:var(--mute)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 60px) var(--px) calc(env(safe-area-inset-bottom) + 92px)}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) var(--px) 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.logo{font:600 19px Fredoka,sans-serif;color:var(--choc);margin-right:auto;display:flex;gap:6px;align-items:center;white-space:nowrap}
.logo svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 9px 3px 4px;font-weight:800;font-size:13px;white-space:nowrap}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-4px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -1px 0 var(--line),0 -10px 24px -16px rgb(80 40 10/.3);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{background:none;border:0;color:var(--mute);font:700 11px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:50px;border-radius:14px;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--choc);background:var(--bg2)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:var(--g) 0;box-shadow:var(--sh)}
.card>h2,.card>h3{margin-bottom:12px}
.acc{background:var(--card);border-radius:var(--r);margin:var(--g) 0;box-shadow:var(--sh);overflow:hidden}
.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:0 16px;min-height:54px;cursor:pointer;user-select:none;-webkit-user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary h2{font-size:16px;flex:1}
.acc>summary .meta{font-size:13px;font-weight:800;color:var(--mute);white-space:nowrap}
.acc>summary::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.acc[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
.acc>summary:focus-visible{outline-offset:-2px;border-radius:var(--r)}
.acc>.body{padding:2px 16px 16px;animation:viewin .2s ease-out}
.acc .body>.mis:first-child{padding-top:4px}
.head{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 var(--g)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;width:auto!important}
.row>.btn{flex:none}
.sp{margin-left:auto}
.banner{background:var(--lav2);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4;margin:0 0 var(--g)}
/* hero */
.scene{position:relative;aspect-ratio:6/5;border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.charwrap{position:absolute;left:50%;bottom:3%;width:min(58%,240px);transform:translateX(-50%)}
.charwrap svg{display:block;width:100%;height:auto}
.bubble{position:absolute;left:12px;top:12px;max-width:55%;background:#fff;color:#3a2316;border-radius:14px 14px 14px 4px;padding:7px 11px;font:500 13px/1.3 Fredoka,sans-serif;box-shadow:0 2px 8px rgb(0 0 0/.08)}
.fab{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:5px;background:var(--yel);color:#3a2316;border:0;border-radius:99px;padding:6px 12px;font:600 13px Fredoka,sans-serif;box-shadow:0 2px 0 var(--yel2);min-height:36px}
.fab svg{width:16px;height:16px}
.namebar{display:flex;align-items:center;gap:10px;margin:16px 2px 8px}
.namebar h1{font-size:22px}
.namebar .mute{font-size:13px}
.lv{margin-left:auto;background:var(--lav2);color:light-dark(#4b3596,#d8ccff);font:600 13px Fredoka,sans-serif;border-radius:10px;padding:4px 10px;white-space:nowrap}
.xp{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#5fd0a6);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpl{font-size:12px;margin:6px 2px 0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.stats3>div{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--sh)}
.stats3 b{display:flex;justify-content:center;align-items:center;gap:3px;font:600 19px Fredoka,sans-serif;white-space:nowrap}
.stats3 span{font-size:12px;color:var(--mute)}
.big{display:flex;width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(180deg,#a8714a,#7a4a2c);color:#fff8e7;font:600 17px Fredoka,sans-serif;letter-spacing:.4px;box-shadow:0 4px 0 #4e2c18;transition:transform .1s,box-shadow .1s;min-height:52px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #4e2c18}
.btn,.chipsx button,.chips button,.tabs button,.reacts button,.cit,.fab{transition:background-color .15s,color .15s,border-color .15s,transform .1s}
.btn:active,.chipsx button:active,.chips button:active,.reacts button:active,.cit:active,.fab:active{transform:scale(.97)}
.big.alt{background:linear-gradient(180deg,#ffe07a,#ffc93a);color:#3a2316;box-shadow:0 4px 0 var(--yel2)}
.hint{text-align:center;font-size:12px;color:var(--mute);margin:12px 0 0}
.btn{border:0;border-radius:12px;padding:8px 14px;background:var(--bg2);font-weight:800;font-size:14px;min-height:40px;white-space:nowrap}
.btn.y{background:var(--yel);color:#3a2316;box-shadow:0 2px 0 var(--yel2)}
.btn.m{background:var(--mint);color:#173d30;box-shadow:0 2px 0 #5fbf9c}
.btn.s{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:var(--g)}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:6px;font-weight:800;font-size:14px;min-height:36px;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.08)}
/* missions */
.mis{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mis:first-of-type{border-top:0;padding-top:4px}
.mis .tx{flex:1}
.mis b{display:block;font-weight:800;font-size:14px}
.rew{font-size:12px;color:var(--mute);white-space:nowrap}
.mbar{height:5px;background:var(--bg2);border-radius:9px;margin-top:6px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--lav)}
.done{color:#3d9c78;font-weight:900;font-size:13px;white-space:nowrap}
.season{display:flex;justify-content:flex-start;gap:12px;align-items:center;background:linear-gradient(120deg,var(--lav2),var(--mint2));border-radius:var(--r);padding:12px 14px;margin:var(--g) 0;width:100%;border:0;text-align:left;color:inherit}
.season svg{width:32px;height:32px;flex:none}
.season b{font:600 16px Fredoka,sans-serif}
.season small{display:block;color:var(--mute);font-size:13px}
/* ranking */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:4px 0;text-align:center}
.pod .av{width:80%;margin:0 auto -4px;position:relative;z-index:1}
.pod:nth-child(2) .av{width:94%}
.pod .nm{font:600 14px Fredoka,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .vv{font-size:12px;color:var(--mute);white-space:nowrap}
.block{border-radius:12px 12px 4px 4px;font:600 22px Fredoka,sans-serif;color:#fff;padding-top:6px;margin-top:6px}
.b1{height:92px;background:linear-gradient(#ffd257,#e9a90f)}.b2{height:70px;background:linear-gradient(#cfd6e6,#97a3bd)}.b3{height:54px;background:linear-gradient(#e9b48a,#b4764a)}
.empty-pod{opacity:.35}
.lrow{display:flex;width:100%;justify-content:flex-start;text-align:left;gap:12px;align-items:center;padding:8px;border:0;background:none;border-radius:14px;min-height:56px}
.lrow:active{background:var(--bg2)}
.lrow .who{display:flex;flex-direction:column}
.pod{display:block;border:0;background:none;padding:0;width:100%}
.avb{border:0;background:none;padding:0}
.pcard{text-align:center}
.pcard .pav{width:150px;margin:4px auto 6px;background:var(--bg2);border-radius:28px;padding:6px}
.pcard h2{font-size:22px}
.pcard>p{color:var(--mute);font-size:14px;margin-top:2px}
.tlist{display:flex;flex-direction:column;gap:8px}
.tlist div{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:14px}
.tlist b{font-family:Fredoka,sans-serif;font-weight:600}
.tlist span{color:var(--mute);font-size:12px;text-align:right}
.medals{display:flex;flex-wrap:wrap;gap:6px}
.auth{padding-top:8px}.auth .onbprev{width:150px}.auth .seg{margin-top:18px}
.auth .err{color:#d9435b;font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
.inst{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;margin:0 0 var(--g);box-shadow:var(--sh)}
.inst img{width:42px;height:42px;border-radius:10px;flex:none}
.inst b{display:block;font:600 15px Fredoka,sans-serif}.inst small{display:block;font-size:12px;color:var(--mute)}
.inst .btn{margin-left:auto}.inst .xs{background:none;border:0;color:var(--mute);font-size:18px;width:32px;height:32px;flex:none}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.steps div{display:flex;gap:12px;align-items:center;background:var(--bg2);border-radius:14px;padding:12px}
.steps i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--choc);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.steps svg{width:26px;height:26px;flex:none;color:#2f7cf6}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);width:calc(100% - 32px);max-width:448px;z-index:40;display:flex;align-items:center;gap:10px;background:#3a2316;color:#fff8e7;border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgb(0 0 0/.25);font-size:14px;font-weight:700;animation:tin .25s ease-out}
.upd .btn{margin-left:auto}
.offl{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);z-index:45;background:#d9435b;color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.evb{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,light-dark(#ffe3e3,#3a1c22),light-dark(#e3f8ef,#1c302a));border-radius:16px;padding:12px 14px;margin-bottom:12px}
.evb svg{width:36px;height:36px;flex:none}.evb b{font:600 15px Fredoka,sans-serif;display:block}.evb small{font-size:12px;color:var(--mute)}
.chestrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:10px 14px 10px 10px;margin:var(--g) 0;box-shadow:var(--sh);width:100%;border:0;text-align:left;justify-content:flex-start}
.chestrow svg{width:46px;height:42px;flex:none}
.chestrow b{display:block;font:600 15px Fredoka,sans-serif}.chestrow small{display:block;font-size:12px;color:var(--mute)}
.chestrow .btn{margin-left:auto}
.chestrow.done{box-shadow:none;background:var(--bg2)}
.chestbig{width:170px;margin:10px auto 0;display:block}.chestbig svg{width:100%;height:auto;overflow:visible}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.chest.open .lid{transform:rotate(-24deg) translate(-6px,-8px)}
.chest .glow{opacity:0;transition:opacity .4s .15s}.chest.open .glow{opacity:1}
.chest.shake{animation:shake .5s ease-in-out}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.reward{text-align:center;margin-top:12px;animation:viewin .3s ease-out}
.reward b{display:block;font:600 22px Fredoka,sans-serif}
.pscene{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;margin-top:6px}
.pscene>svg{position:absolute;inset:0;width:100%;height:100%}
.pscene .charwrap{width:52%}
.mood{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:var(--mute);background:var(--bg2);border-radius:99px;padding:3px 10px}
.medals svg{width:30px;height:30px}
.lrow.me{background:var(--bg2)}
.lrow .n{width:20px;text-align:right;font:600 14px Fredoka,sans-serif;color:var(--mute)}
.mini{width:40px;height:40px;flex:none}
.mini svg{width:100%;height:100%}
.mini *,.nanim *{animation:none!important}
.who{flex:1}.who b{display:block;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mute{font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--lav2);margin:3px 4px 0 0;white-space:nowrap}
.tag.g{background:light-dark(#fff1bf,#3a3112);color:light-dark(#6d4a00,#ffd257)}
.num{text-align:right;font-weight:900;font-size:14px;white-space:nowrap}
.titles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{background:var(--bg2);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center}
.tcard .mini{width:36px;height:36px}
.tcard b{display:block;font:600 14px Fredoka,sans-serif}
.tcard small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mute);text-align:right;font-weight:800;padding:6px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
/* feed & chat */
.post{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.post:first-of-type{border-top:0;padding-top:0}
.post .tx{flex:1;font-size:14px}
.post q{display:block;font-style:italic;color:var(--mute);margin-top:2px}
.time{font-size:12px;color:var(--mute)}
.reacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.reacts button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 9px;min-height:34px;min-width:46px;font-weight:800;font-size:13px}
.reacts button[aria-pressed=true]{background:light-dark(#fff1bf,#3a3112);border-color:var(--yel)}
.chatlist{height:min(52dvh,440px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 6px;overscroll-behavior:contain}
.chatlist>.mute{margin:auto;text-align:center;font-size:14px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mini{width:30px;height:30px}
.bub{background:var(--bg2);border-radius:16px 16px 16px 4px;padding:7px 12px;font-size:14px}
.msg.me .bub{background:var(--choc);color:var(--bg);border-radius:16px 16px 4px 16px}
.bub b{display:block;font-size:12px;color:var(--mute)}
.bub p{overflow-wrap:anywhere}
.bub .time{display:block;font-size:11px;opacity:.7;color:inherit;text-align:right}
.chatin{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
/* shop */
.chipsx{display:flex;gap:6px;overflow-x:auto;margin:0 calc(var(--px) * -1);padding:2px var(--px) 12px;scroll-snap-type:x proximity;scroll-padding-inline:var(--px);scrollbar-width:none}
.chipsx::-webkit-scrollbar,.chatlist::-webkit-scrollbar,.panel::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.chatlist,.panel,.scroll{scrollbar-width:none}
.chipsx{cursor:grab;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chipsx.end{-webkit-mask:none;mask:none}
.chipsx.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.chipsx button,.chips button{flex:none;scroll-snap-align:start;border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;background:var(--card);font-weight:700;font-size:14px;min-height:36px;white-space:nowrap}
.chipsx button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--choc);border-color:var(--choc);color:var(--bg)}

function socialSync(){if(!me||ro)return false;me.duels=me.duels||{};me.gifts=me.gifts||{};me.got=me.got||{};let ch=false;const wk=wKey(),now=Date.now();
  for(const [id,d] of Object.entries(me.duels)){const o=P(d.vs),od=o&&(o.duels||{})[id];
    if(d.st==='pend'){if(od&&od.st==='on'){d.st='on';ch=true}else if((od&&od.st==='no')||d.wk!==wk){me.coins+=d.bet;d.st='ref';ch=true}}
    if(d.st==='on'){if(d.wk===wk){if(d.sc!==me.wk.xp){d.sc=me.wk.xp;ch=true}}
      else if(od){const a=d.sc||0,b=od.sc||0;d.os=b;d.st=a>b?'won':a<b?'lost':'tie';if(a>b){me.coins+=d.bet*2;postTo('duelwin',{vs:d.vs,bet:d.bet})}else if(a===b)me.coins+=d.bet;ch=true}}
    if(now-(d.ts||0)>35*864e5&&d.st!=='on'&&d.st!=='pend'){delete me.duels[id];ch=true}}
  for(const [id,g] of Object.entries(me.gifts))if(now-g.ts>30*864e5){delete me.gifts[id];ch=true}
  for(const [id,t] of Object.entries(me.got))if(now-t>60*864e5){delete me.got[id];ch=true}
  for(const p of members()){if(p.uid===uid)continue;for(const [id,g] of Object.entries(p.gifts||{})){if(g.to!==uid||me.got[id])continue;me.got[id]=now;ch=true;
    if(g.coins)me.coins+=g.coins;if(g.item&&I[g.item])me.owned={...me.owned,[g.item]:1};ui.gq=(ui.gq||[]).concat({from:p.uid,...g})}}
  return ch}
const oppXP=d=>{const o=P(d.vs);return o&&o.wk&&o.wk.k===d.wk?o.wk.xp:(o&&(o.duels||{})[d.id]||{}).sc||0};

  const act=mine.filter(d=>d.st==='on'&&d.wk===wk),pend=mine.filter(d=>d.st==='pend'),res=mine.filter(d=>['won','lost','tie'].includes(d.st)&&!d.seen).slice(0,3);

   ${inv.map(d=>`<div class="dinv"><span><b>${E(d.from.name)}</b> te retó por <b>${d.bet}</b> monedas</span><div class="row"><button class="btn y" data-a="duelok" data-id="${d.id}">Aceptar</button><button class="btn" data-a="duelno" data-id="${d.id}">No</button></div></div>`).join('')}
   ${res.map(d=>`<div class="dres ${d.st}"><span>${d.st==='won'?`¡Le ganaste a <b>${E(pname(d.vs))}</b>! +${d.bet*2} monedas`:d.st==='lost'?`<b>${E(pname(d.vs))}</b> te ganó el duelo (${d.sc||0} a ${d.os||0})`:`Empate con <b>${E(pname(d.vs))}</b>: te devolvimos las monedas`}</span><button class="x2" data-a="duelseen" data-id="${d.id}" aria-label="Ocultar">×</button></div>`).join('')}
   ${act.map(row).join('')}
   ${pend.map(d=>`<div class="dinv"><span>Esperando a <b>${E(pname(d.vs))}</b> · ${d.bet} monedas</span><button class="btn" data-a="duelcancel" data-id="${d.id}">Cancelar</button></div>`).join('')}
